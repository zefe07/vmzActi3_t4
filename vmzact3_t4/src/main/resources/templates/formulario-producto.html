<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
</head>
<body>
    <h1 th:text="${producto.id == null ? 'Crear Producto' : 'Editar Producto'}">Formulario</h1>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        
        <input type="hidden" th:field="*{id}" />

        <label>Nombre del Producto:</label><br>
        <input type="text" th:field="*{nombre}" required /><br><br>

        <label>Precio:</label><br>
        <input type="number" step="0.01" th:field="*{precio}" required /><br><br>

        <label>Categoría:</label><br>
        <select th:field="*{categoria}">
            <option value="">Selecciona una categoría</option>
            <option th:each="cat : ${categorias}" 
                    th:value="${cat.id}" 
                    th:text="${cat.nombre}">
            </option>
        </select><br><br>

        <button type="submit">Guardar Producto</button>
        <a href="/productos">Cancelar</a>
    </form>
</body>
</html>
