<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
</head>
<body>
    <h1>Gestión de Productos (CRUD)</h1>
    <a href="/productos/nuevo">➕ Nuevo Producto</a>
    <br><br>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.id}">1</td>
                <td th:text="${prod.nombre}">Nombre</td>
                <td th:text="${prod.precio}">0.0</td>
                <td th:text="${prod.categoria != null ? prod.categoria.nombre : 'Sin categoría'}">Categoría</td> 
                <td>
                    <a th:href="@{/productos/editar/{id}(id=${prod.id})}">Editar</a> | 
                    <a th:href="@{/productos/eliminar/{id}(id=${prod.id})}" onclick="return confirm('¿Seguro que deseas eliminar?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
